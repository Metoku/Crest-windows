name: Crest Windows Browser Preview

on:
  workflow_dispatch:
  push:
    branches: [windows-core-ci, windows-session-persistence, windows-navigation-history, windows-sidebar-management, windows-sidebar-dragdrop]
    paths:
      - 'CrestWindows/**'
      - 'CrestWindowsSmoke/**'
      - 'CrestCore/src/CrestCore/**'
      - '.github/workflows/windows-preview.yml'
  pull_request:
    branches: [main, windows-core-ci, windows-session-persistence, windows-navigation-history, windows-sidebar-management]
    paths:
      - 'CrestWindows/**'
      - 'CrestWindowsSmoke/**'
      - 'CrestCore/src/CrestCore/**'
      - '.github/workflows/windows-preview.yml'

permissions:
  contents: read

jobs:
  build-windows-preview:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: CrestCore/global.json

      - name: Exercise CrestCore Spaces and tabs without launching the UI
        shell: pwsh
        run: dotnet run --project CrestWindowsSmoke/CrestWindowsSmoke.csproj -c Release --nologo

      - name: Publish unpackaged self-contained WinUI 3 preview (x64)
        shell: pwsh
        run: |
          dotnet publish CrestWindows/CrestWindows.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=false -p:PublishReadyToRun=false --nologo -o CrestWindows/publish

      - name: Confirm deployment dependencies and include diagnostics
        shell: pwsh
        run: |
          $folder = 'CrestWindows/publish'
          foreach ($file in @('CrestWindows.exe', 'Microsoft.UI.Xaml.dll', 'CrestWindows.runtimeconfig.json')) {
            $path = Join-Path $folder $file
            if (!(Test-Path -LiteralPath $path)) {
              throw "Required Windows deployment file not present: $path"
            }
          }
          foreach ($file in @('Start-Crest-Windows.cmd', 'Launch-Crest.ps1', 'README-FIRST.txt')) {
            Copy-Item -LiteralPath (Join-Path 'CrestWindows' $file) -Destination $folder
          }
          Write-Host "Validated EXE and WinUI DLL; added diagnostic launcher."
          Get-ChildItem -Path $folder | Select-Object -First 20 Name,Length

      - name: Upload complete deployment folder (not the EXE alone)
        uses: actions/upload-artifact@v4
        with:
          name: crest-windows-webview2-preview-x64
          path: CrestWindows/publish/
          if-no-files-found: error
          retention-days: 14
